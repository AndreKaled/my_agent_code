services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    environment:
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  agent:
    build: .
    container_name: my_coder_agent
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./workspace:/workspace
    depends_on:
      - ollama
    stdin_open: true
    tty: true

volumes:
  ollama_data: